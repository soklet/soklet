name: CI

on:
  push:
    branches: [master, develop, 'feature/**']
  pull_request:
  schedule:
    # Nightly coverage-guided fuzzing and soak tests. PR/push jobs replay the corpus deterministically.
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      operational_candidate_commit:
        description: Full lowercase candidate commit for the six-hour operational history run
        required: false
        type: string

# Cancel superseded push/PR runs on the same ref, but never cancel a scheduled
# or manually dispatched nightly run before its resource-delta assertions complete.
concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'nightly' || 'ci' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (JDK ${{ matrix.jdk }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel the 21/25 jobs if 17 fails — we want every JDK's result.
      fail-fast: false
      matrix:
        # 17 exercises the platform-thread fallback path; 21+ exercises virtual threads.
        jdk: ['17', '21', '25']
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: ${{ matrix.jdk }}
          cache: maven

      - name: Verify pinned JSON Schema Test Suite
        run: node scripts/json-schema-test-suite/verify.mjs

      - name: Run tests
        run: mvn -B -ntp clean test

      - name: Package main, source, and Javadoc JARs
        run: mvn -B -ntp -DskipTests clean package

      - name: Compile benchmarks
        run: mvn -B -ntp -f benchmarks/pom.xml -DskipTests clean compile

  api-diff:
    name: API Compatibility and MCP Freezes (JDK 17)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Verify reviewed API incompatibilities and MCP freezes
        run: scripts/verify-mcp-api-freezes.sh

      - name: Upload API-diff evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-diff-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            target/japicmp/mcp-api-diff.xml
            target/japicmp/mcp-api-diff.incompatibilities.jsonl
            target/japicmp/mcp-api-freeze.xml
            target/mcp-api-freezes/*.signatures.jsonl

  fuzz-regression:
    name: Fuzz Corpus Replay (JDK 25)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      - name: Verify preserved JSON corpus
        run: node scripts/verify-json-corpus.mjs

      - name: Replay fuzz corpus
        run: mvn -B -ntp -f fuzz/pom.xml clean test

  soak-smoke:
    name: Soak Smoke (JDK 25)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      - name: Test soak evidence verifier
        run: node scripts/verify-soak-evidence-self-test.mjs

      - name: Run soak smoke tests
        run: SOKLET_SOAK_PROFILE=smoke mvn -B -ntp -f soak/pom.xml clean test

      - name: Require soak smoke evidence
        if: always()
        run: node scripts/verify-soak-evidence.mjs smoke

      - name: Upload soak smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: soak-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            soak/target/soak-report.md
            soak/target/surefire-reports

  static-analysis:
    name: Static Analysis (JDK 21)
    # Error Prone requires JDK 21+ to run and lags the newest JDKs, so this gate pins JDK 21 while
    # the build's release target stays 17. NullAway runs as advisory WARN visibility (it does not
    # fail the build); the gate fails only on Error Prone's default-ERROR checks. Opinionated style
    # checks are disabled in the static-analysis Maven profile.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Error Prone + NullAway
        run: mvn -B -ntp -Pstatic-analysis clean compile

  spotbugs:
    name: SpotBugs (JDK 21)
    # SpotBugs runs as a separate opt-in gate so the normal test matrix and release-17 compile path stay
    # unchanged. The Maven profile carries a reviewed baseline for low-signal categories and fails on any
    # unfiltered findings.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Test SpotBugs exclusion-target verifier
        run: node scripts/verify-spotbugs-exclusions-self-test.mjs

      - name: Run SpotBugs
        run: mvn -B -ntp -Pspotbugs -DskipTests clean compile spotbugs:check

      - name: Verify SpotBugs exclusion targets
        run: node scripts/verify-spotbugs-exclusions.mjs

  mcp-conformance-phase-5:
    name: MCP Conformance Candidate Artifact Phase 5 (JDK 17)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Soklet
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Initialize MCP conformance evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/conformance/official
          printf '%s\n' '{"formatVersion":1,"phase":5,"status":"STARTED"}' \
            > target/conformance/official/ci-started.json

      - name: Download and verify pinned Node.js distribution
        shell: bash
        run: >-
          bash conformance/official/scripts/install-pinned-node-linux-x64.sh
          "${RUNNER_TEMP}" "${GITHUB_PATH}"
          target/conformance/official/node-distribution.txt

      - name: Compile and verify production golden-wire bridge
        run: >-
          mvn -B -ntp
          -Dtest=McpFinalTagGoldenWireProductionTests
          test

      - name: Package candidate and build candidate-artifact fixture
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests package
          sh conformance/official/build-public-fixture.sh \
            "${GITHUB_WORKSPACE}/target/soklet-4.0.0-SNAPSHOT.jar" \
            "${GITHUB_WORKSPACE}/target/conformance/public-fixture" \
            > target/conformance/official/public-fixture-classpath.txt

      - name: Verify candidate-artifact localization API
        shell: bash
        run: >-
          verification/localization/verify.sh
          "${GITHUB_WORKSPACE}/target/soklet-4.0.0-SNAPSHOT.jar"

      - name: Run strict local off-network MCP simulator scenarios
        shell: bash
        run: |
          set -euo pipefail
          node conformance/official/local-simulator-self-test.mjs
          node conformance/official/run-local-simulator.mjs \
            --classpath "$(cat target/conformance/official/public-fixture-classpath.txt)" \
            --project-root "${GITHUB_WORKSPACE}"

      - name: Check out pinned official MCP conformance suite
        uses: actions/checkout@v6
        with:
          repository: modelcontextprotocol/conformance
          ref: 49103de6ed70804e940637bf3e9e29e4a3f54e64
          path: .mcp-conformance-source
          persist-credentials: false

      - name: Verify pinned suite source inputs
        run: >-
          node --input-type=module -e
          "Promise.all([import('node:child_process'),import('./conformance/official/verify.mjs')])
          .then(([{execFileSync},{verifyManifestSet,verifyOfficialSuite,verifyToolchain}]) => {
          const {pins}=verifyManifestSet();
          verifyToolchain(pins,execFileSync('npm',['--version'],{encoding:'utf8'}).trim());
          verifyOfficialSuite('.mcp-conformance-source',pins,{requireBuilt:false});
          })"

      - name: Build pinned official MCP conformance suite
        working-directory: .mcp-conformance-source
        run: |
          mkdir -p "${RUNNER_TEMP}/soklet-mcp-npm-cache"
          touch "${RUNNER_TEMP}/soklet-mcp-user.npmrc" \
            "${RUNNER_TEMP}/soklet-mcp-global.npmrc"
          env -i \
            PATH="${PATH}" \
            LANG=C.UTF-8 \
            CI=true \
            NO_COLOR=1 \
            npm_config_cache="${RUNNER_TEMP}/soklet-mcp-npm-cache" \
            npm_config_userconfig="${RUNNER_TEMP}/soklet-mcp-user.npmrc" \
            npm_config_globalconfig="${RUNNER_TEMP}/soklet-mcp-global.npmrc" \
            npm ci --ignore-scripts
          env -i \
            PATH="${PATH}" \
            LANG=C.UTF-8 \
            CI=true \
            NO_COLOR=1 \
            npm_config_cache="${RUNNER_TEMP}/soklet-mcp-npm-cache" \
            npm_config_userconfig="${RUNNER_TEMP}/soklet-mcp-user.npmrc" \
            npm_config_globalconfig="${RUNNER_TEMP}/soklet-mcp-global.npmrc" \
            npm run build

      - name: Self-test Soklet conformance infrastructure
        run: |
          node conformance/official/self-test.mjs \
            --suite-dir .mcp-conformance-source
          node conformance/official/runner-self-test.mjs

      - name: Run all applicable Phase 5 official scenarios
        run: |
          mkdir -p target/conformance/official/phase-5
          node conformance/official/run.mjs \
            --suite-dir "${{ github.workspace }}/.mcp-conformance-source" \
            --work-dir "${{ github.workspace }}/target/conformance/official/phase-5" \
            --classpath "$(cat target/conformance/official/public-fixture-classpath.txt)" \
            --project-root "${{ github.workspace }}" \
            --phase 5

      - name: Upload MCP conformance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mcp-conformance-phase-5-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            target/conformance/official
            target/conformance/public-fixture/dependencies.txt

  fuzz-nightly:
    name: Nightly Fuzzing (JDK 25, ${{ matrix.target_id }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Jazzer/JUnit can run only one @FuzzTest per JVM when JAZZER_FUZZ=1.
      # Keep each target in its own Maven invocation so every fuzz target gets a nightly slot.
      fail-fast: false
      matrix:
        include:
          - target_id: request-parser
            test_selector: RequestParserFuzzTest#parseIncrementalRequestOnlyRejectsWithDeclaredExceptions
            corpus_path: com.soklet.internal.microhttp.RequestParserFuzzTest/parseIncrementalRequestOnlyRejectsWithDeclaredExceptions
          - target_id: multipart-parser
            test_selector: DefaultMultipartParserFuzzTest#extractMultipartFieldsOnlyRejectsWithExpectedExceptions
            corpus_path: com.soklet.DefaultMultipartParserFuzzTest/extractMultipartFieldsOnlyRejectsWithExpectedExceptions
          - target_id: http-date
            test_selector: HttpDateFuzzTest#fromHeaderValueNeverThrows
            corpus_path: com.soklet.HttpDateFuzzTest/fromHeaderValueNeverThrows
          - target_id: parameterized-header-value
            test_selector: ParameterizedHeaderValueFuzzTest#builderOnlyRejectsWithIllegalArgumentException
            corpus_path: com.soklet.ParameterizedHeaderValueFuzzTest/builderOnlyRejectsWithIllegalArgumentException
          - target_id: media-range
            test_selector: MediaRangeFuzzTest#mediaRangeParsingNeverThrows
            corpus_path: com.soklet.MediaRangeFuzzTest/mediaRangeParsingNeverThrows
          - target_id: query-format
            test_selector: QueryFormatFuzzTest#extractQueryParametersOnlyRejectsWithIllegalRequestException
            corpus_path: com.soklet.QueryFormatFuzzTest/extractQueryParametersOnlyRejectsWithIllegalRequestException
          - target_id: response-cookie
            test_selector: ResponseCookieFuzzTest#fromSetCookieHeaderRepresentationOnlyRejectsWithIllegalArgumentException
            corpus_path: com.soklet.ResponseCookieFuzzTest/fromSetCookieHeaderRepresentationOnlyRejectsWithIllegalArgumentException
          - target_id: trace-context
            test_selector: TraceContextFuzzTest#fromHeaderValuesNeverThrows
            corpus_path: com.soklet.TraceContextFuzzTest/fromHeaderValuesNeverThrows
          - target_id: mcp-json-parse
            test_selector: McpJsonCodecFuzzTest#strictJsonFuzzRejectsInvalidBytesOnlyWithIllegalArgumentException
            corpus_path: com.soklet.internal.mcp.protocol.McpJsonCodecFuzzTest/strictJsonFuzzRejectsInvalidBytesOnlyWithIllegalArgumentException
          - target_id: mcp-json-round-trip
            test_selector: McpJsonCodecFuzzTest#strictJsonFuzzRoundTripsStructurally
            corpus_path: com.soklet.internal.mcp.protocol.McpJsonCodecFuzzTest/strictJsonFuzzRoundTripsStructurally
          - target_id: mcp-json-rpc-envelope
            test_selector: McpJsonRpcEnvelopeCodecFuzzTest#decodeClassifiesOrRejectsOnlyWithTypedWireFailure
            corpus_path: com.soklet.internal.mcp.protocol.McpJsonRpcEnvelopeCodecFuzzTest/decodeClassifiesOrRejectsOnlyWithTypedWireFailure
          - target_id: mcp-mirrored-header
            test_selector: McpMirroredHeaderCodecFuzzTest#decodeStringOnlyRejectsWithRedactedIllegalArgumentException
            corpus_path: com.soklet.internal.mcp.protocol.McpMirroredHeaderCodecFuzzTest/decodeStringOnlyRejectsWithRedactedIllegalArgumentException
          - target_id: mcp-profile-1-schema
            test_selector: McpToolSchemaProfileFuzzTest#compileAndEvaluateRemainTypedAndBounded
            corpus_path: com.soklet.internal.mcp.schema.McpToolSchemaProfileFuzzTest/compileAndEvaluateRemainTypedAndBounded
          - target_id: mcp-cursor-validator
            test_selector: McpCursorValidatorFuzzTest#cursorValidationIsUtf8ExactAndTotal
            corpus_path: com.soklet.internal.mcp.protocol.McpCursorValidatorFuzzTest/cursorValidationIsUtf8ExactAndTotal
          - target_id: mcp-request-state-plaintext
            test_selector: McpRequestStatePlaintextCodecFuzzTest#decodeOnlyRejectsWithUniformRedactedIllegalArgumentException
            corpus_path: com.soklet.internal.mcp.protocol.McpRequestStatePlaintextCodecFuzzTest/decodeOnlyRejectsWithUniformRedactedIllegalArgumentException
          - target_id: mcp-simulation-capture
            test_selector: McpSimulationCaptureFuzzTest#captureStateMachineRemainsBoundedTerminalAndIdempotent
            corpus_path: com.soklet.internal.mcp.protocol.McpSimulationCaptureFuzzTest/captureStateMachineRemainsBoundedTerminalAndIdempotent
          - target_id: mcp-localization-byte-accounting
            test_selector: McpLocalizationFuzzTest#replacementByteAccountingMatchesTheProductionEncoder
            corpus_path: com.soklet.McpLocalizationFuzzTest/replacementByteAccountingMatchesTheProductionEncoder
          - target_id: mcp-localization-preferences
            test_selector: McpLocalizationFuzzTest#boundedPreferenceDerivationIsTotalAndNeverTruncates
            corpus_path: com.soklet.McpLocalizationFuzzTest/boundedPreferenceDerivationIsTotalAndNeverTruncates
          - target_id: mcp-localization-overlay
            test_selector: McpLocalizationFuzzTest#overlayPointerHandlingIsTotalAndNonMutating
            corpus_path: com.soklet.McpLocalizationFuzzTest/overlayPointerHandlingIsTotalAndNonMutating
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install checksum-pinned Corretto 25
        shell: bash
        run: >-
          bash release/scripts/install-pinned-corretto-linux-x64.sh
          toystoreJava "${RUNNER_TEMP}" "${GITHUB_PATH}" "${GITHUB_ENV}"
          "${RUNNER_TEMP}/fuzz-java-distribution.txt"

      - name: Select checksum-pinned Corretto 25
        shell: bash
        run: |
          printf 'JAVA_HOME=%s\n' "$SOKLET_RELEASE_TOYSTORE_JAVA_HOME" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$SOKLET_RELEASE_TOYSTORE_JAVA_HOME" >> "$GITHUB_PATH"

      - name: Restore Maven repository
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: fuzz-maven-${{ runner.os }}-${{ hashFiles('pom.xml', 'fuzz/pom.xml') }}

      - name: Restore Jazzer corpus
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: fuzz/.cifuzz-corpus
          key: jazzer-${{ runner.os }}-${{ github.ref_name }}-${{ matrix.target_id }}-${{ github.run_id }}
          restore-keys: |
            jazzer-${{ runner.os }}-${{ github.ref_name }}-${{ matrix.target_id }}-
            jazzer-${{ runner.os }}-${{ github.ref_name }}-
            jazzer-${{ runner.os }}-

      - name: Compile fuzz target and materialize Jazzer runtime
        run: mvn -B -ntp -f fuzz/pom.xml -DskipTests test-compile

      - name: Verify complete checksum-pinned Jazzer runtime
        shell: bash
        run: |
          printf '%s  %s\n' \
            1b1ae8658216031c50e989e6008193c04c2ad63c4c9b9876d4c66e23ecb75312 \
            "${HOME}/.m2/repository/com/code-intelligence/jazzer-junit/0.30.0/jazzer-junit-0.30.0.jar" \
            | sha256sum --check --strict
          printf '%s  %s\n' \
            8bdeac017bcd3d9473c9772fac62111c4df830188571def1d001a1b743a62b2f \
            "${HOME}/.m2/repository/com/code-intelligence/jazzer/0.30.0/jazzer-0.30.0.jar" \
            | sha256sum --check --strict
          printf '%s  %s\n' \
            d36a725cfedcb7f3590206866cc2836f84d12afccf7c98912f5c720e4d2208d7 \
            "${HOME}/.m2/repository/com/code-intelligence/jazzer-api/0.30.0/jazzer-api-0.30.0.jar" \
            | sha256sum --check --strict

      - name: Run fuzz targets
        shell: bash
        run: |
          JAZZER_FUZZ=1 mvn -B -ntp -f fuzz/pom.xml \
            -Dtest="${{ matrix.test_selector }}" \
            -Djazzer.max_duration=300s surefire:test

      - name: Produce canonical fuzz target receipt
        shell: bash
        run: |
          mkdir -p target/release-history/fuzz-target
          node scripts/produce-release-history.mjs fuzz-target \
            --target-id "${{ matrix.target_id }}" \
            --corpus-root "${{ github.workspace }}/fuzz/.cifuzz-corpus/${{ matrix.corpus_path }}" \
            --surefire-root "${{ github.workspace }}/fuzz/target/surefire-reports" \
            --jazzer-jar "${HOME}/.m2/repository/com/code-intelligence/jazzer-junit/0.30.0/jazzer-junit-0.30.0.jar" \
            --jazzer-engine-jar "${HOME}/.m2/repository/com/code-intelligence/jazzer/0.30.0/jazzer-0.30.0.jar" \
            --jazzer-api-jar "${HOME}/.m2/repository/com/code-intelligence/jazzer-api/0.30.0/jazzer-api-0.30.0.jar" \
            --toolchain-evidence "${RUNNER_TEMP}/fuzz-java-distribution.txt" \
            --output "${{ github.workspace }}/target/release-history/fuzz-target/${{ matrix.target_id }}.json"

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jazzer-${{ matrix.target_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 90
          path: |
            fuzz/.cifuzz-corpus
            fuzz/src/test/resources
            fuzz/target/surefire-reports
            ${{ runner.temp }}/fuzz-java-distribution.txt

      - name: Upload canonical fuzz target receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fuzz-history-target-${{ matrix.target_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: target/release-history/fuzz-target/${{ matrix.target_id }}.json

  fuzz-nightly-history:
    name: Assemble Nightly Fuzz History (JDK 25)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: fuzz-nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install checksum-pinned Corretto 25
        shell: bash
        run: >-
          bash release/scripts/install-pinned-corretto-linux-x64.sh
          toystoreJava "${RUNNER_TEMP}" "${GITHUB_PATH}" "${GITHUB_ENV}"
          "${RUNNER_TEMP}/fuzz-history-java-distribution.txt"

      - name: Select checksum-pinned Corretto 25
        shell: bash
        run: |
          printf 'JAVA_HOME=%s\n' "$SOKLET_RELEASE_TOYSTORE_JAVA_HOME" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$SOKLET_RELEASE_TOYSTORE_JAVA_HOME" >> "$GITHUB_PATH"

      - name: Restore Maven repository
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: fuzz-history-maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      - name: Download canonical fuzz target receipts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: fuzz-history-target-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: target/release-history/fuzz-target-receipts

      - name: Restore exact-candidate fuzz history state
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target/release-history/fuzz-state
          key: release-fuzz-history-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            release-fuzz-history-${{ runner.os }}-${{ github.sha }}-

      - name: Package exact candidate main JAR
        run: mvn -B -ntp -DskipTests package

      - name: Accumulate exact-candidate fuzz history
        id: history
        shell: bash
        run: |
          mkdir -p target/release-history/fuzz-state
          previous=()
          if [[ -f target/release-history/fuzz-state/history-state.json ]]; then
            previous=(--previous-state "${{ github.workspace }}/target/release-history/fuzz-state/history-state.json")
          fi
          node scripts/produce-release-history.mjs fuzz-nightly \
            --candidate-root "${{ github.workspace }}" \
            --completed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --target-receipts-root "${{ github.workspace }}/target/release-history/fuzz-target-receipts" \
            --toolchain-evidence "${RUNNER_TEMP}/fuzz-history-java-distribution.txt" \
            "${previous[@]}" \
            --state-output "${{ github.workspace }}/target/release-history/fuzz-state/history-state.json" \
            --history-output "${{ github.workspace }}/fuzz-nightly-history.json"
          if [[ -f fuzz-nightly-history.json ]]; then
            printf 'complete=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'complete=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and bundle complete fuzz history
        if: steps.history.outputs.complete == 'true'
        shell: bash
        run: |
          node scripts/verify-release-history.mjs fuzz-nightly
          node scripts/create-release-harness-bundle.mjs \
            --gate fuzz-nightly-history \
            --candidate-root "${{ github.workspace }}" \
            --evidence-root "${{ github.workspace }}" \
            --output "${{ github.workspace }}/target/release-history/fuzz-nightly-history-bundle.json"

      - name: Upload fuzz history accumulation state
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fuzz-history-state-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: target/release-history/fuzz-state/history-state.json

      - name: Upload immutable fuzz history bundle
        if: steps.history.outputs.complete == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fuzz-nightly-history-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: target/release-history/fuzz-nightly-history-bundle.json

      - name: Upload fuzz history producer evidence
        if: steps.history.outputs.complete == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fuzz-nightly-history-raw-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            fuzz-nightly-history.json
            target/release-history/fuzz-state/history-state.json
            ${{ runner.temp }}/fuzz-history-java-distribution.txt

  soak-nightly:
    name: Nightly Soak (JDK 25)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install checksum-pinned Corretto 25
        shell: bash
        run: >-
          bash release/scripts/install-pinned-corretto-linux-x64.sh
          toystoreJava "${RUNNER_TEMP}" "${GITHUB_PATH}" "${GITHUB_ENV}"
          "${RUNNER_TEMP}/soak-nightly-java-distribution.txt"

      - name: Select checksum-pinned Corretto 25
        shell: bash
        run: |
          printf 'JAVA_HOME=%s\n' "$SOKLET_RELEASE_TOYSTORE_JAVA_HOME" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$SOKLET_RELEASE_TOYSTORE_JAVA_HOME" >> "$GITHUB_PATH"

      - name: Restore Maven repository
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: soak-nightly-maven-${{ runner.os }}-${{ hashFiles('pom.xml', 'soak/pom.xml') }}

      - name: Restore exact-candidate soak history state
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target/release-history/soak-state
          key: release-soak-history-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            release-soak-history-${{ runner.os }}-${{ github.sha }}-

      - name: Run nightly soak tests
        run: SOKLET_SOAK_PROFILE=nightly mvn -B -ntp -f soak/pom.xml clean test

      - name: Require nightly soak evidence
        if: always()
        run: node scripts/verify-soak-evidence.mjs nightly

      - name: Upload nightly soak evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: soak-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            soak/target/soak-report.md
            soak/target/surefire-reports
            ${{ runner.temp }}/soak-nightly-java-distribution.txt

      - name: Package exact candidate main JAR
        run: mvn -B -ntp -DskipTests package

      - name: Accumulate exact-candidate soak history
        id: soak-history
        shell: bash
        run: |
          mkdir -p target/release-history/soak-state
          previous=()
          if [[ -f target/release-history/soak-state/history-state.json ]]; then
            previous=(--previous-state "${{ github.workspace }}/target/release-history/soak-state/history-state.json")
          fi
          node scripts/produce-release-history.mjs soak-nightly \
            --candidate-root "${{ github.workspace }}" \
            --completed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --toolchain-evidence "${RUNNER_TEMP}/soak-nightly-java-distribution.txt" \
            "${previous[@]}" \
            --state-output "${{ github.workspace }}/target/release-history/soak-state/history-state.json" \
            --history-output "${{ github.workspace }}/soak-nightly-history.json"
          if [[ -f soak-nightly-history.json ]]; then
            printf 'complete=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'complete=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and bundle complete soak history
        if: steps.soak-history.outputs.complete == 'true'
        shell: bash
        run: |
          node scripts/verify-release-history.mjs soak-nightly
          node scripts/create-release-harness-bundle.mjs \
            --gate soak-nightly-history \
            --candidate-root "${{ github.workspace }}" \
            --evidence-root "${{ github.workspace }}" \
            --output "${{ github.workspace }}/target/release-history/soak-nightly-history-bundle.json"

      - name: Upload soak history accumulation state
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: soak-history-state-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: target/release-history/soak-state/history-state.json

      - name: Upload immutable soak history bundle
        if: steps.soak-history.outputs.complete == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: soak-nightly-history-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: target/release-history/soak-nightly-history-bundle.json

      - name: Upload soak history producer evidence
        if: steps.soak-history.outputs.complete == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: soak-nightly-history-raw-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            soak-nightly-history.json
            target/release-history/soak-state/history-state.json
            ${{ runner.temp }}/soak-nightly-java-distribution.txt

  operational-history:
    name: Operational History (exact candidate, JDK 17)
    if: github.event_name == 'workflow_dispatch' && inputs.operational_candidate_commit != ''
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 420
    steps:
      - name: Check out exact operational candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.operational_candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact immutable candidate checkout
        shell: bash
        env:
          SOKLET_OPERATIONAL_CANDIDATE_COMMIT: ${{ inputs.operational_candidate_commit }}
        run: |
          set -euo pipefail
          [[ "$SOKLET_OPERATIONAL_CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'operational_candidate_commit must be a full lowercase commit ID.\n' >&2
            exit 1
          }
          [[ "$GITHUB_SHA" == "$SOKLET_OPERATIONAL_CANDIDATE_COMMIT" ]] || {
            printf 'Executing workflow revision does not match operational_candidate_commit.\n' >&2
            exit 1
          }
          [[ "$(git rev-parse --verify HEAD)" == "$SOKLET_OPERATIONAL_CANDIDATE_COMMIT" ]] || {
            printf 'Checked-out HEAD does not match operational_candidate_commit.\n' >&2
            exit 1
          }
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || {
            printf 'Exact operational candidate checkout is not clean.\n' >&2
            exit 1
          }

      - name: Install checksum-pinned Node and npm
        shell: bash
        run: >-
          bash conformance/official/scripts/install-pinned-node-linux-x64.sh
          "${RUNNER_TEMP}" "${GITHUB_PATH}"
          "${RUNNER_TEMP}/operational-node-distribution.txt"

      - name: Install checksum-pinned Corretto 17
        shell: bash
        run: >-
          bash release/scripts/install-pinned-corretto-linux-x64.sh
          java "${RUNNER_TEMP}" "${GITHUB_PATH}" "${GITHUB_ENV}"
          "${RUNNER_TEMP}/operational-java-distribution.txt"

      - name: Install checksum-pinned Maven
        shell: bash
        run: >-
          bash release/scripts/install-pinned-maven-linux-x64.sh
          "${RUNNER_TEMP}" "${GITHUB_PATH}"
          "${RUNNER_TEMP}/operational-maven-distribution.txt"

      - name: Self-test operational producer
        run: node scripts/produce-operational-history-self-test.mjs

      - name: Build exact candidate main JAR
        run: mvn -B -ntp -DskipTests clean package

      - name: Retain operational toolchain provenance after clean build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/release-history/operational-raw
          cp -- "${RUNNER_TEMP}/operational-node-distribution.txt" \
            target/release-history/operational-raw/node-distribution.txt
          cp -- "${RUNNER_TEMP}/operational-java-distribution.txt" \
            target/release-history/operational-raw/java-distribution.txt
          cp -- "${RUNNER_TEMP}/operational-maven-distribution.txt" \
            target/release-history/operational-raw/maven-distribution.txt

      - name: Run registered six-hour load and observation interval
        shell: bash
        run: |
          node scripts/produce-operational-history.mjs run \
            --candidate-root "${GITHUB_WORKSPACE}" \
            --work-root "${GITHUB_WORKSPACE}/target/release-history/operational-raw/work" \
            --observation-output "${GITHUB_WORKSPACE}/target/release-history/operational-raw/operational-observation.json" \
            --toolchain-evidence "${GITHUB_WORKSPACE}/target/release-history/operational-raw/java-distribution.txt"

      - name: Finalize, verify, and bundle operational history
        shell: bash
        run: |
          node scripts/produce-release-history.mjs operational \
            --candidate-root "${GITHUB_WORKSPACE}" \
            --observation "${GITHUB_WORKSPACE}/target/release-history/operational-raw/operational-observation.json" \
            --toolchain-evidence "${GITHUB_WORKSPACE}/target/release-history/operational-raw/java-distribution.txt" \
            --history-output "${GITHUB_WORKSPACE}/operational-history.json"
          node scripts/verify-release-history.mjs operational
          node scripts/create-release-harness-bundle.mjs \
            --gate operational-history \
            --candidate-root "${GITHUB_WORKSPACE}" \
            --evidence-root "${GITHUB_WORKSPACE}" \
            --output "${GITHUB_WORKSPACE}/target/release-history/operational-history-bundle.json"

      - name: Upload immutable operational history bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: operational-history-${{ inputs.operational_candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: target/release-history/operational-history-bundle.json

      - name: Upload operational producer diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: operational-history-raw-${{ inputs.operational_candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            operational-history.json
            target/release-history/operational-raw

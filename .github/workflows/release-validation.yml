name: Release Verification

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Optional Git ref to verify (defaults to the selected branch's dispatch commit)
        required: false
        type: string
      javax_ref:
        description: Git ref for the javax adapter
        required: false
        type: string
        default: feature/2.0.0
      jakarta_ref:
        description: Git ref for the Jakarta adapter
        required: false
        type: string
        default: feature/2.0.0
      otel_ref:
        description: Git ref for the OpenTelemetry adapter
        required: false
        type: string
        default: feature/mcp-v2
      toystore_ref:
        description: Git ref for ToyStore
        required: false
        type: string
        default: feature/mcp-v2
      barebones_ref:
        description: Git ref for barebones
        required: false
        type: string
        default: feature/mcp-v2

concurrency:
  group: release-verification-${{ inputs.candidate_commit || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.jdk == '21' && 'Publishing build' || 'Compatibility check' }} (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        jdk: ['21', '25']
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_commit || github.sha }}

      - name: Set up JDK 26 for Javadoc
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: corretto
          java-version: '26'

      - name: Retain separate Javadoc toolchain
        shell: bash
        run: printf 'SOKLET_JAVADOC_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: corretto
          java-version: ${{ matrix.jdk }}
          cache: maven

      - name: Run functional verification
        shell: bash
        run: scripts/validate-release-candidate.sh | tee "${RUNNER_TEMP}/build-verification.log"

      - name: Retain build log
        if: always()
        continue-on-error: true
        run: |
          mkdir -p target
          cp "${RUNNER_TEMP}/build-verification.log" target/build-verification.log

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-results-jdk-${{ matrix.jdk }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            target/surefire-reports
            target/build-verification.log

      - name: Upload JDK 21 publication inputs
        if: success() && matrix.jdk == '21'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          # Consumer-only retries reuse this run's successful producer. A rerun
          # of the producer replaces the artifact instead of colliding with it.
          name: publication-build-jdk-21-${{ github.run_id }}
          overwrite: true
          if-no-files-found: error
          retention-days: 30
          path: |
            pom.xml
            target/soklet-4.0.0.jar
            target/soklet-4.0.0-sources.jar
            target/soklet-4.0.0-javadoc.jar
            target/build-verification.log

  sibling-projects:
    name: Sibling consumer tests
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Soklet
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_commit || github.sha }}
          path: soklet

      - name: Check out javax adapter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: soklet/soklet-servlet-javax
          ref: ${{ inputs.javax_ref || 'feature/2.0.0' }}
          persist-credentials: false
          path: soklet-servlet-javax

      - name: Check out Jakarta adapter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: soklet/soklet-servlet-jakarta
          ref: ${{ inputs.jakarta_ref || 'feature/2.0.0' }}
          persist-credentials: false
          path: soklet-servlet-jakarta

      - name: Check out OpenTelemetry adapter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: soklet/soklet-otel
          ref: ${{ inputs.otel_ref || 'feature/mcp-v2' }}
          persist-credentials: false
          path: soklet-otel

      - name: Check out ToyStore
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: soklet/toystore-app
          ref: ${{ inputs.toystore_ref || 'feature/mcp-v2' }}
          persist-credentials: false
          path: toystore-app

      - name: Check out barebones
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: soklet/barebones-app
          ref: ${{ inputs.barebones_ref || 'feature/mcp-v2' }}
          persist-credentials: false
          path: barebones-app

      - name: Download JDK 21 publication inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: publication-build-jdk-21-${{ github.run_id }}
          path: publication-inputs

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: corretto
          java-version: '21'

      - name: Retain JDK 21 home
        run: printf 'SOKLET_JDK21_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up JDK 25 for ToyStore
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: corretto
          java-version: '25'

      - name: Retain JDK 25 home
        run: printf 'SOKLET_JDK25_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Check sibling builds and barebones HTTP behavior
        run: >-
          node soklet/scripts/verify-sibling-projects.mjs
          publication-inputs/target/soklet-4.0.0.jar --workspace "${GITHUB_WORKSPACE}"

  sdk-interoperability:
    name: TypeScript and Go MCP interoperability
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_commit || github.sha }}

      - name: Download JDK 21 publication inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: publication-build-jdk-21-${{ github.run_id }}
          path: publication-inputs

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: corretto
          java-version: '21'

      - name: Install Node and npm
        run: >-
          bash conformance/official/scripts/install-pinned-node-linux-x64.sh
          "${RUNNER_TEMP}" "${GITHUB_PATH}" "${RUNNER_TEMP}/interop-node.txt"

      - name: Install Go
        run: >-
          bash release/scripts/install-pinned-go-linux-x64.sh
          "${RUNNER_TEMP}" "${GITHUB_PATH}" "${RUNNER_TEMP}/interop-go.txt"

      - name: Check real SDK roundtrips
        run: >-
          node scripts/verify-mcp-interoperability.mjs
          publication-inputs/target/soklet-4.0.0.jar
